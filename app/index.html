<!DOCTYPE html>
<html lang="tr" data-theme="auto"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Toplantı Yöneticisi</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--tx:#1b2433;--mu:#6b778c;--pr:#2b5fd9;--bd:#e1e6ef;--ok:#1f9d63;--er:#d64545;--wa:#d98a14}
:root[data-theme=dark]{--bg:#10151f;--card:#1a2130;--tx:#e8ecf3;--mu:#93a0b8;--bd:#2a3347;--pr:#6e95ff}
@media(prefers-color-scheme:dark){:root[data-theme=auto]{--bg:#10151f;--card:#1a2130;--tx:#e8ecf3;--mu:#93a0b8;--bd:#2a3347;--pr:#6e95ff}}
*{box-sizing:border-box}body{margin:0;font:14px/1.5 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--tx);display:flex;min-height:100vh}a{color:var(--pr)}
aside{width:230px;flex:none;background:var(--card);border-right:1px solid var(--bd);padding:16px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;margin-bottom:14px}
aside button{all:unset;cursor:pointer;padding:9px 12px;border-radius:8px;color:var(--mu)}
aside button:hover{background:var(--bg)}aside button.on{background:var(--pr);color:#fff}
main{flex:1;min-width:0;padding:24px;max-width:1000px}h1{margin:0 0 16px;font-size:22px}h3{margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:14px;min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:14px}.grid .card{margin:0}
.stat b{font-size:28px;display:block}.stat span{color:var(--mu)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{flex:1;min-width:0}
.btn{border:0;background:var(--pr);color:#fff;padding:8px 14px;border-radius:8px;cursor:pointer;font:inherit}
.btn.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}.btn.d{background:var(--er)}
input,textarea,select{width:100%;min-width:0;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
label{display:block;margin:12px 0 4px;color:var(--mu);font-size:12px}
.item{padding:10px 0;border-bottom:1px solid var(--bd);cursor:pointer}.item:last-child{border:0}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--bg);color:var(--mu);border:1px solid var(--bd);text-decoration:none;white-space:nowrap}
a.tag{color:var(--pr);cursor:pointer}
.late{color:var(--er)}.soon{color:var(--wa)}.done{text-decoration:line-through;opacity:.55}.mu{color:var(--mu)}
.pY{color:var(--er)}.pO{color:var(--wa)}.pD{color:var(--mu)}
.irow{display:grid;grid-template-columns:minmax(0,1fr) 140px 140px 40px;gap:8px;margin-bottom:6px}
.mr{border-bottom:1px solid var(--bd)}.mr:last-child{border:0}.mr .item{border:0;flex-wrap:nowrap}.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tg{flex:none;width:24px;height:24px;line-height:22px;text-align:center;border:1px solid var(--bd);border-radius:6px;font-weight:700}
.mb{padding:2px 0 14px 34px}.mb p{margin:4px 0}

/* Tutanak Tablosu Stilleri */
.min-table{width:100%;border-collapse:collapse;margin-top:10px;background:var(--card)}
.min-table th, .min-table td{border:1px solid var(--bd);padding:10px 12px;text-align:left;vertical-align:top}
.min-table th{background:rgba(0,0,0,0.03);font-weight:600;color:var(--mu);width:150px}
:root[data-theme=dark] .min-table th{background:rgba(255,255,255,0.05)}
.min-table .sec-hdr{background:var(--pr);color:#fff;font-weight:700;text-align:left}
.min-table .num-col{width:40px;text-align:center;font-weight:bold}
.min-table .due-col{width:120px}
.min-table .owner-col{width:160px}

@media(max-width:700px){body{flex-direction:column}aside{width:100%;height:auto;flex-direction:row;overflow:auto;position:static}.brand,#who{display:none}.irow{grid-template-columns:minmax(0,1fr) 40px}.irow input[type=date], .irow input[placeholder="Sorumlu"]{grid-column:1;grid-row:auto}}
.cg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.cd{min-height:88px;border:1px solid var(--bd);border-radius:8px;padding:4px;background:var(--card);cursor:pointer;overflow:hidden;min-width:0}.cd.w{min-height:200px}.cd.o{opacity:.45}.cd.t{border-color:var(--pr)}.cd.s{outline:2px solid var(--pr)}
.cc{font-size:11px;border-radius:4px;padding:1px 4px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cm{background:var(--pr);color:#fff}.ct{background:var(--bg);border:1px solid var(--bd)}
.arow{display:grid;grid-template-columns:minmax(0,1fr) 190px 40px;gap:8px;margin-bottom:6px}
@media(max-width:700px){.cd{min-height:60px}.cc{font-size:9px}.arow{grid-template-columns:minmax(0,1fr) 40px}.arow input:nth-child(2){grid-column:1}}
</style></head><body>
<aside>
<div class="brand"><svg width="34" height="34" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#2b5fd9"/><rect x="14" y="18" width="36" height="30" rx="5" fill="none" stroke="#fff" stroke-width="4"/><path d="M14 28h36" stroke="#fff" stroke-width="4"/><path d="M24 38l5 5 10-10" fill="none" stroke="#7CFFB2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M22 14v8M42 14v8" stroke="#fff" stroke-width="4" stroke-linecap="round"/></svg>Toplantı<br>Yöneticisi</div>
<button data-v="dash">📊 Dashboard</button><button data-v="list">📅 Toplantılar</button><button data-v="cal">🗓 Takvim</button><button data-v="mins">📝 Toplantı Tutanakları</button><button data-v="tasks">✅ Görevler</button><button data-v="owners">👥 Sorumlular</button><button data-v="tpl">📋 Şablonlar</button><button data-v="settings">⚙️ Ayarlar</button><button data-v="trash">🗑 Çöp Kutusu</button><div class="sp"></div>
<div class="mu" id="who" style="font-size:12px;padding:0 12px"></div>
<button id="nt">🔔 Bildirimler</button><button id="cs">📊 Excel (CSV)</button><button id="bk">💾 Yedekle</button><button id="rs">📂 Geri Yükle</button><input type="file" id="fl" accept=".json" hidden>
</aside>
<main id="m"></main><datalist id="dl_p"></datalist>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
let DB=ld('tm_db',[]),MIN=ld('tm_min',[]),TASKS=ld('tm_tasks',[]),TPL=ld('tm_tpl',[]),TRASH=ld('tm_trash',[]),PROF=ld('tm_prof',null),THEME=ld('tm_theme',{mode:'auto'});
let view='dash',cur=null,flt='open',OPEN=new Set(),rl=()=>{},NX=[];
const mkI=a=>(a||[]).map(t=>typeof t=='string'?{id:uid(),text:t,owner:'',due:'',done:false}:{owner:'',...t});
const norm=()=>{DB.forEach(m=>{m.tag=m.tag||'';m.participants=m.participants||[];
 if(m.tasks){m.tasks.forEach(t=>TASKS.push({...t,mid:m.id,pri:t.pri||'O'}));delete m.tasks}
 const tp=mkI(m.topics),dc=mkI(m.decisions);delete m.topics;delete m.decisions;
 if(tp.length||dc.length)MIN.push({id:uid(),no:'',title:m.title+' tutanağı',date:(m.when||'').slice(0,10),mid:m.id,prep:{...PROF},topics:tp,decisions:dc})});
 MIN.forEach(n=>{n.no=n.no||'';n.topics=mkI(n.topics);n.decisions=mkI(n.decisions);n.prep=n.prep||{}})};
const save=()=>{try{localStorage.setItem('tm_db',JSON.stringify(DB));localStorage.setItem('tm_min',JSON.stringify(MIN));localStorage.setItem('tm_tasks',JSON.stringify(TASKS));localStorage.setItem('tm_tpl',JSON.stringify(TPL));localStorage.setItem('tm_trash',JSON.stringify(TRASH))}catch(e){toast('Kayıt yapılamadı')}};
const saveP=()=>localStorage.setItem('tm_prof',JSON.stringify(PROF));
norm();save();
function toast(t,undo){const d=document.createElement('div');d.style='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1b2433;color:#fff;padding:10px 16px;border-radius:8px;z-index:120;display:flex;gap:12px;align-items:center';d.append(t);if(undo){const b=document.createElement('button');b.textContent='Geri al';b.className='btn';b.style.padding='4px 10px';b.onclick=()=>{d.remove();undo()};d.append(b)}document.body.append(d);setTimeout(()=>d.remove(),undo?7000:2800)}
function ask(msg,def,cb){const o=document.createElement('div');o.style='position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;z-index:98';
 o.innerHTML=`<div class="card" style="width:min(380px,90vw);margin:0"><p>${esc(msg)}</p>${def===null?'':'<input id="ak" value="'+esc(def)+'">'}<div class="row" style="margin-top:12px"><button class="btn" id="ok">Tamam</button><button class="btn g" id="no">İptal</button></div></div>`;
 document.body.append(o);const i=o.querySelector('#ak');o.querySelector('#ok').onclick=()=>{const v=i?i.value:true;o.remove();cb(v)};o.querySelector('#no').onclick=()=>o.remove();i&&i.focus()}
const fd=d=>d?new Date(d).toLocaleString('tr-TR',{dateStyle:'medium',timeStyle:d.length>10?'short':undefined}):'-';
const fday=d=>d?new Date(d).toLocaleDateString('tr-TR'):'-';
const today=()=>new Date().toISOString().slice(0,10);
const prepStr=p=>[p&&p.name,p&&p.dept,p&&p.role].filter(Boolean).join(' · ')||'-';
const people=()=>[...new Set([...DB.flatMap(m=>m.participants),...TASKS.map(t=>t.owner),...MIN.flatMap(n=>[...n.topics,...n.decisions].map(i=>i.owner))].filter(Boolean))];
const allTasks=()=>[...TASKS.map(t=>({...t,kind:'Görev',mt:(DB.find(m=>m.id==t.mid)||{}).title||'—'})),
 ...MIN.flatMap(n=>[['Konu',n.topics],['Karar',n.decisions]].flatMap(([k,a])=>a.filter(i=>i.due||i.owner).map(i=>({...i,tid:n.id,mt:n.title,kind:k,pri:'O',owner:i.owner||''}))))];
const find=id=>TASKS.find(t=>t.id==id)||MIN.flatMap(n=>[...n.topics,...n.decisions]).find(i=>i.id==id);
const lk=t=>t.tid?`<a href="#" onclick="go('mind','${t.tid}');return false">${esc(t.mt)}</a>`:t.mid?`<a href="#" onclick="openMeet('${t.mid}');return false">${esc(t.mt)}</a>`:'Bağımsız';
function tog(id){const t=find(id);if(t){t.done=!t.done;save();go(view,cur)}}
function tcls(t){if(t.done||!t.due)return'';const d=(new Date(t.due)-new Date(today()))/864e5;return d<0?'late':d<=3?'soon':''}
function openMeet(id){OPEN.add(id);go('list')}
const NAV={new:'list',edit:'list',mind:'mins',minnew:'mins',minedit:'mins',tf:'tasks'};
function go(v,id){view=v;cur=id||null;document.querySelectorAll('aside [data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v==(NAV[v]||v)));
 $('#dl_p').innerHTML=people().map(p=>`<option value="${esc(p)}">`).join('');
 ({dash,list,cal,tasks,owners,trash,tpl,settings,mins,mind,new:()=>form(),edit:()=>form(DB.find(m=>m.id==cur)),minnew:()=>minForm(null,id),minedit:()=>minForm(MIN.find(x=>x.id==cur)),tf:()=>taskForm(id)})[v]();scrollTo(0,0)}
document.querySelectorAll('aside [data-v]').forEach(b=>b.onclick=()=>{if(b.dataset.v=='list')OPEN.clear();go(b.dataset.v)});

function applyTheme(){const r=document.documentElement;r.dataset.theme=THEME.mode||'auto';
 ['pr','bg','card','tx'].forEach(k=>THEME[k]?r.style.setProperty('--'+k,THEME[k]):r.style.removeProperty('--'+k));$('#who').textContent=PROF?'👤 '+PROF.name:''}
function profModal(){const o=document.createElement('div');o.style='position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:97';
 o.innerHTML=`<div class="card" style="width:min(420px,92vw);margin:0"><h3>Hoş geldiniz 👋</h3><p class="mu">Bu bilgiler toplantı tutanaklarında ve PDF çıktısında "Hazırlayan" olarak görünür. Ayarlar'dan değiştirebilirsiniz.</p>
 <label>İsim Soyisim *</label><input id="p_n"><label>Bölümünüz *</label><input id="p_d"><label>Göreviniz *</label><input id="p_r"><div class="row" style="margin-top:14px"><button class="btn" id="p_s">Kaydet ve Başla</button></div></div>`;
 document.body.append(o);$('#p_n').focus();
 $('#p_s').onclick=()=>{const n=$('#p_n').value.trim(),d=$('#p_d').value.trim(),r=$('#p_r').value.trim();if(!n||!d||!r)return toast('Tüm alanları doldurun');PROF={name:n,dept:d,role:r};saveP();o.remove();applyTheme()}}

function settings(){const p=PROF||{},cv=k=>THEME[k]||getComputedStyle(document.documentElement).getPropertyValue('--'+k).trim();
 $('#m').innerHTML=`<h1>Ayarlar</h1><div class="card"><h3>Kişisel bilgiler (Hazırlayan)</h3><label>İsim Soyisim</label><input id="s_n" value="${esc(p.name)}"><label>Bölüm</label><input id="s_d" value="${esc(p.dept)}"><label>Görev</label><input id="s_r" value="${esc(p.role)}"></div>
 <div class="card"><h3>Tema</h3><label>Mod</label><select id="s_m"><option value="auto">Sistem</option><option value="light">Açık</option><option value="dark">Koyu</option></select>
 <div class="grid" style="margin-top:6px">${[['pr','Ana renk'],['bg','Arka plan'],['card','Kart'],['tx','Yazı']].map(([k,l])=>`<div><label>${l}</label><input type="color" id="c_${k}" value="${cv(k)}" style="height:38px;padding:2px"></div>`).join('')}</div>
 <label>Hazır ana renkler</label><div class="row">${['#2b5fd9','#1f9d63','#7c4dff','#e8590c','#d6336c','#0b7285'].map(c=>`<button class="btn" style="background:${c};width:34px;height:34px;padding:0" onclick="$('#c_pr').value='${c}'"></button>`).join('')}<button class="btn g" id="s_r2">Varsayılan renklere dön</button></div></div>
 <button class="btn" id="s_s">Kaydet</button>`;
 $('#s_m').value=THEME.mode||'auto';
 $('#s_r2').onclick=()=>{THEME={mode:$('#s_m').value};applyTheme();localStorage.setItem('tm_theme',JSON.stringify(THEME));settings()};
 $('#s_s').onclick=()=>{const n=$('#s_n').value.trim();if(!n)return toast('İsim Soyisim zorunlu');PROF={name:n,dept:$('#s_d').value.trim(),role:$('#s_r').value.trim()};saveP();
  THEME={mode:$('#s_m').value};['pr','bg','card','tx'].forEach(k=>{const v=$('#c_'+k).value;if(v!=cv0[k])THEME[k]=v});
  localStorage.setItem('tm_theme',JSON.stringify(THEME));applyTheme();toast('Ayarlar kaydedildi')};
 const cv0={};['pr','bg','card','tx'].forEach(k=>cv0[k]=$('#c_'+k).value)}

function dash(){
 const T=allTasks(),open=T.filter(t=>!t.done),late=open.filter(t=>t.due&&t.due<today());
 const up=DB.filter(m=>m.when>=new Date().toISOString().slice(0,16)).sort((a,b)=>a.when.localeCompare(b.when));
 NX=open.filter(t=>t.due).sort((a,b)=>a.due.localeCompare(b.due)).slice(0,8);
 $('#m').innerHTML=`<h1>Dashboard</h1><div class="grid">
 <div class="card stat"><b>${DB.length}</b><span>Toplantı</span></div><div class="card stat"><b>${MIN.length}</b><span>Tutanak</span></div><div class="card stat"><b>${up.length}</b><span>Yaklaşan toplantı</span></div>
 <div class="card stat"><b>${open.length}</b><span>Açık madde/görev</span></div><div class="card stat"><b class="late">${late.length}</b><span>Geciken</span></div>
 <div class="card stat"><b style="color:var(--ok)">${T.length?Math.round((T.length-open.length)/T.length*100):0}%</b><span>Tamamlanma</span></div>
 <div class="card stat"><b class="pY">${open.filter(t=>t.pri=='Y').length}</b><span>Yüksek öncelikli</span></div></div>
 <div class="card"><h3>Yaklaşan toplantılar</h3>${up.slice(0,5).map(m=>`<div class="item" onclick="openMeet('${m.id}')"><b>${esc(m.title)}</b><div class="mu">${fd(m.when)} · ${esc(m.location)}</div></div>`).join('')||'<span class="mu">Yok</span>'}</div>
 <div class="card"><h3>Yaklaşan terminler</h3>${NX.map((t,i)=>`<div class="item" onclick="openT(${i})"><span class="${tcls(t)}">${fday(t.due)}</span> — ${esc(t.text)} <span class="tag">${t.kind}</span><div class="mu">${esc(t.mt)}</div></div>`).join('')||'<span class="mu">Yok</span>'}</div>`}
function openT(i){const t=NX[i];t.tid?go('mind',t.tid):t.mid?openMeet(t.mid):go('tasks')}

/* ---- Toplantılar ---- */
const mrow=m=>{const o=OPEN.has(m.id),ns=MIN.filter(n=>n.mid==m.id).sort((a,b)=>b.date.localeCompare(a.date));
 return `<div class="mr"><div class="item row" onclick="tgl('${m.id}')"><span class="tg">${o?'−':'+'}</span><b class="sp ell">${esc(m.title)}</b>${m.tag?`<span class="tag">${esc(m.tag)}</span>`:''}<span class="mu">${fd(m.when)}</span></div>
 ${o?`<div class="mb"><p><b>Amaç:</b> ${esc(m.purpose)||'-'}</p><p><b>Yer:</b> ${esc(m.location)||'-'}</p><p><b>Katılımcılar:</b> ${m.participants.map(p=>`<span class="tag">${esc(p)}</span>`).join(' ')||'-'}</p>
 ${(m.agenda||[]).length?`<p><b>Gündem:</b></p><ol style="margin:2px 0 6px">${m.agenda.map(a=>`<li>${esc(a.text)}${a.owner?` <span class="mu">(${esc(a.owner)})</span>`:''}</li>`).join('')}</ol>`:''}${m.dur?`<p><b>Süre:</b> ${Math.round(m.dur/60)} dk</p>`:''}<p><b>Tutanaklar:</b> ${ns.map(n=>`<a class="tag" href="#" onclick="go('mind','${n.id}');return false">📎 ${esc(n.title)}</a>`).join(' ')||'<span class="mu">Yok</span>'}</p>
 <p class="mu">${TASKS.filter(t=>t.mid==m.id).length+ns.reduce((c,n)=>c+[...n.topics,...n.decisions].filter(i=>i.due||i.owner).length,0)} bağlı görev (tutanaktaki maddeler dahil)</p>
 <div class="row"><button class="btn g" onclick="go('minnew','${m.id}')">${(m.agenda||[]).length?'📋 Gündemden tutanak':'+ Tutanak'}</button><button class="btn g" onclick="tmStart('${m.id}')">⏱ Başlat</button><button class="btn g" onclick="go('edit','${m.id}')">Düzenle</button><button class="btn g" onclick="ics('${m.id}')">📆 .ics</button><button class="btn g" onclick="gcal('${m.id}')">Google Takvim</button><button class="btn g" onclick="mkTpl('${m.id}')">Şablon yap</button><button class="btn d" onclick="delMeet('${m.id}')">Sil</button></div></div>`:''}</div>`};
function tgl(id){OPEN.has(id)?OPEN.delete(id):OPEN.add(id);rl()}
function list(){
 $('#m').innerHTML=`<div class="row"><h1 class="sp">Toplantılar</h1><button class="btn" onclick="go('new')">➕ Yeni</button></div>
 <input id="q" placeholder="Ara (başlık, katılımcı...)" style="margin-bottom:12px"><div class="card" id="ls" style="padding:6px 16px"></div>`;
 rl=()=>{const q=$('#q').value.toLowerCase();$('#ls').innerHTML=DB.filter(m=>JSON.stringify(m).toLowerCase().includes(q)).sort((a,b)=>b.when.localeCompare(a.when)).map(mrow).join('')||'<div style="padding:10px 0" class="mu">Toplantı bulunamadı</div>'};
 $('#q').oninput=rl;rl()}
function form(m,base){
 const isNew=!m;m=m||{title:'',purpose:'',participants:[],when:'',location:'',tag:'',...(base||{})};
 $('#m').innerHTML=`<h1>${m.id?'Toplantıyı Düzenle':'Yeni Toplantı'}</h1><div class="card">
 <label>Başlık *</label><input id="f_t" value="${esc(m.title)}"><label>Amaç</label><textarea id="f_p" rows="2">${esc(m.purpose)}</textarea>
 <label>Tarih ve saat *</label><input type="datetime-local" id="f_w" value="${m.when}"><label>Yer / Link</label><input id="f_l" value="${esc(m.location)}"><label>Etiket / Proje</label><input id="f_g" value="${esc(m.tag)}">
 <label>Katılımcılar (virgülle ayırın)</label><input id="f_k" value="${esc(m.participants.join(', '))}"><div id="ch" class="row" style="margin-top:6px"></div><label>Gündem maddeleri (toplantı öncesi, isteğe bağlı)</label>${ablock(m.agenda||[])}
 ${isNew?'<label>Tekrar</label><div class="row"><select id="f_r" style="width:auto"><option value="">Tekrarlama</option><option value="7">Haftalık</option><option value="14">2 haftada bir</option><option value="M">Aylık</option></select><input id="f_n" type="number" min="2" max="52" value="4" style="width:80px"> kez</div>':''}
 <div class="row" style="margin-top:16px"><button class="btn" id="sv">Kaydet</button><button class="btn g" onclick="go('list')">İptal</button></div></div>`;
 $('#ch').innerHTML=people().map(p=>`<span class="tag" style="cursor:pointer" data-p="${esc(p)}">+ ${esc(p)}</span>`).join('');
 document.querySelectorAll('#ch [data-p]').forEach(s=>s.onclick=()=>{const i=$('#f_k'),a=i.value.split(',').map(x=>x.trim()).filter(Boolean);if(!a.includes(s.dataset.p))a.push(s.dataset.p);i.value=a.join(', ')});
