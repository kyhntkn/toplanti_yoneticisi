name: Derle (EXE + Store)
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: EXE (kurulum + taşınabilir)
        run: npm run dist:exe
      - name: Store paketi (APPX)
        run: npm run dist:store
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: ToplantiYoneticisi-windows
          path: |
            dist/*.exe
            dist/*.appx
          if-no-files-found: warn
